<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern To-Do List</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:100%;
    max-width:600px;
}

.card{
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(10px);
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h2{
    font-family: Arial, sans-serif;
    font-weight:bold;
}

.task-complete{
    text-decoration: line-through;
    opacity:0.6;
}

.list-group-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: rgba(255,255,255,0.1);
    color:white;
    border:none;
    margin-bottom:10px;
    border-radius:8px;
}

input{
    font-family: Arial, sans-serif;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2 class="text-center mb-4">✨ My To-Do List</h2>

        <!-- INPUT -->
        <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control" placeholder="Enter your task">
            <button class="btn btn-warning" onclick="addTask()">Add</button>
        </div>

        <!-- LIST -->
        <ul class="list-group" id="taskList"></ul>

    </div>

</div>

<script>

function addTask(){

    let input = document.getElementById("taskInput");
    let value = input.value.trim();

    if(value === ""){
        alert("Please enter a task!");
        return;
    }

    let li = document.createElement("li");
    li.className = "list-group-item";

    let span = document.createElement("span");
    span.innerText = value;
    span.style.cursor = "pointer";

    span.onclick = function(){
        span.classList.toggle("task-complete");
    };

    let btn = document.createElement("button");
    btn.className = "btn btn-danger btn-sm";
    btn.innerText = "Delete";

    btn.onclick = function(){
        li.remove();
    };

    li.appendChild(span);
    li.appendChild(btn);

    document.getElementById("taskList").appendChild(li);

    input.value = "";
}

</script>

</body>
</html>
